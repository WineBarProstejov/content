# local_backend: true
backend:
  # name: git-gateway
  name: github
  repo: WineBarProstejov/content
  branch: main
  auth_scope: repo
  base_url: https://content-87t.pages.dev
  auth_endpoint: api/auth
  
media_folder: "public/uploads"
public_folder: "public/uploads"

logo:
  src: "/public/uploads/logo-no.webp"
  show_in_header: true

collections:
  - name: "events"
    label: "Akce (události)"
    media_folder: "akce/"
    public_folder: "public/content/app/components/akce"
    files:
      - file: "public/content/app/components/events.json"
        label: "Akce"
        name: "events"
        fields:
          - label: "Akce"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Název", name: "title", widget: "string" }
              - { label: "Datum", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Popis", name: "description", widget: "text" }
              - { label: "Fotka", name: "image", widget: "image", required: false }

  - name: "rating"
    label: "Hodnocení (Google)"
    files:
      - file: "public/content/app/components/rating.json"
        label: "Hodnocení"
        name: "rating"
        fields:
          - { label: "Hodnocení (např. 4.9)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, default: 4.9 }
          - { label: "Počet recenzí (nepovinné, např. 126)", name: "count", widget: "string", required: false }
          - { label: "Odkaz na recenze", name: "url", widget: "string", required: false, hint: "Např. odkaz na Google recenze podniku" }

  - name: "welcome"
    label: "Úvodní text (hlavní strana)"
    files:
      - file: "public/content/app/components/welcome.json"
        label: "Úvodní text"
        name: "welcome"
        fields:
          - { label: "Podtitulek pod názvem podniku", name: "subtitle", widget: "string" }

  - name: "about"
    label: "About Section"
    media_folder: "interier/"
    public_folder: "public/content/app/components/interier"
    files:
      - file: "public/content/app/components/about.json"
        label: "About JSON"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Timeline"
            name: "timeline"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Vision"
            name: "vision"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Mission"
                name: "mission"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Values"
                name: "values"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "List", name: "list", widget: "list", field: { label: "Value", name: "value", widget: "string" } }
                  - { label: "Feedback", name: "feedback", widget: "text" }

  - name: "galerie"
    label: "Galerie"
    media_folder: "galerie/"
    public_folder: "public/content/app/components/galerie"
    files:
      - file: "public/content/app/components/galerie.json"
        label: "Galerie JSON"
        name: "galerie"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}} — {{fields.src}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string" }

  - name: "oteviracka"
    label: "Otevírací doba"
    files:
      - file: "public/content/app/components/oteviracka.json"
        label: "Otevírací doba JSON"
        name: "oteviracka"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Den 1"
            name: "day1"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 2"
            name: "day2"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 3"
            name: "day3"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 4"
            name: "day4"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 5"
            name: "day5"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 6"
            name: "day6"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Den 7"
            name: "day7"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Funkce (generátor)"
            name: "funkce"
            widget: "object"
            fields:
              - label: "Po-Čt"
                name: "poctv"
                widget: "object"
                fields:
                  - { label: "Od", name: "od", widget: "string" }
                  - { label: "Do", name: "do", widget: "string" }
              - label: "Pátek"
                name: "patek"
                widget: "object"
                fields:
                  - { label: "Od", name: "od", widget: "string" }
                  - { label: "Do", name: "do", widget: "string" }
              - label: "Sobota"
                name: "sobota"
                widget: "object"
                fields:
                  - { label: "Od", name: "od", widget: "string" }
                  - { label: "Do", name: "do", widget: "string" }

  - name: "menu"
    label: "Menu"
    media_folder: "menu/"
    public_folder: "public/content/app/components/galerie/menu"
    files:
      - file: "public/content/app/components/menu.json"
        label: "Menu JSON"
        name: "menu"
        fields:
          - label: "Cover"
            name: "cover"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string", required: false }
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}} — {{fields.src}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string" }